name: Publish Chinese Bot API reader
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static documentation
        run: node scripts/build-docs.js
      - name: Verify published feedback bundle
        run: |
          node -e "const fs=require('node:fs'); const html=fs.readFileSync('dist/index.html','utf8'); const app=fs.readFileSync('dist/app.js','utf8'); const docs=JSON.parse(fs.readFileSync('dist/data/docs.json','utf8')); const checks=[['versioned app asset',html.includes('app.js?v=nav-restore-translation-flat-20261110') && html.includes('styles.css?v=all-reading-panels-flat-20261110')],['GitHub Issue URL',app.includes('issues/new?title=')],['2800-character hard ceiling',app.includes('ISSUE_URL_MAX_LENGTH = 2800')],['long-section translation omitted',app.includes(\"translationMode !== 'omit'\")],['short getMe full prefill retained',docs.sections.some(s=>s.id==='getme'&&s.translation?.text)],['644 chapters',docs.sections.length===644]]; for(const [name,ok] of checks){console.log((ok?'PASS ':'FAIL ')+name); if(!ok)process.exitCode=1;}"
      - name: Test issue prefill URL lengths
        run: node scripts/test-issue-prefill.js
      - name: Check bilingual navigation
        run: node scripts/test-menu.js
      - name: Verify Markdown and full translations
        run: node scripts/test-rendering.js
      - name: Audit translated field coverage
        run: node scripts/audit-translation-coverage.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish to Pages
        uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 1200000
